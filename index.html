.quiz-wrap{max-width:850px;margin:auto;padding:22px 14px 44px}
.quiz-head{text-align:center;margin-bottom:15px}.quiz-head small{letter-spacing:.3em;color:#6f6049}.quiz-head h2{font-weight:500;letter-spacing:.15em;margin:8px 0;color:#58472f}
.progress{display:flex;gap:5px;max-width:600px;margin:12px auto 20px}.progress i{height:6px;flex:1;border-radius:8px;background:#d2c39e}.progress i.on{background:#24757d;box-shadow:0 0 7px rgba(36,117,125,.28)}
.scroll{position:relative;background:linear-gradient(90deg,rgba(120,82,38,.07),transparent 7% 93%,rgba(120,82,38,.07)),rgba(248,238,213,.98);border:1px solid #bfa87c;box-shadow:0 18px 45px rgba(65,46,23,.18);padding:34px 38px 30px;min-height:590px}
.scroll:before,.scroll:after{content:"";position:absolute;left:-8px;right:-8px;height:17px;border:1px solid #aa9165;background:linear-gradient(#e6d2a7,#f6e9ca,#d9c092);box-shadow:0 3px 7px rgba(0,0,0,.12)}
.scroll:before{top:-10px}.scroll:after{bottom:-10px}
.qmeta{display:flex;align-items:baseline;gap:9px;color:#765f3d}.qnum{font-size:44px}.qtype{font-size:13px;letter-spacing:.14em}
.question{font-size:20px;line-height:1.75;margin:14px 0 16px;font-weight:600}
.hint{font-size:13px;color:#7a6748;margin-bottom:10px}.rank-status{color:#0e6768;font-weight:600;min-height:26px;margin:6px 0}
.option{position:relative;width:100%;text-align:left;border:1px solid #bca579;background:rgba(255,255,255,.34);padding:14px 48px 14px 15px;margin:9px 0;color:#2f281f;cursor:pointer;line-height:1.55;transition:.15s}
.option:hover{border-color:#1f7272;background:#edf0df;transform:translateY(-1px)}
.option.chosen{background:#dce7da;border-color:#176b69}
.badge{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid #20706d;color:#17645f;font-weight:700}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.ghost{border:1px solid #a88e61;background:transparent;color:#5c4b33;padding:11px 18px;cursor:pointer}.quiz-cta{padding:11px 25px}

.result-wrap{position:relative;z-index:2;max-width:980px;margin:auto;padding:40px 16px 70px}
.result-head{text-align:center;padding:12px 0 25px}.result-head small{letter-spacing:.32em;color:#d2b873}.result-head h1{font-weight:500;font-size:clamp(38px,7vw,64px);margin:12px 0;color:#f0d594;text-shadow:0 5px 20px #000}.seal{display:inline-block;border:1px solid #d1ad5c;padding:7px 16px;color:#f0dba5}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{background:rgba(6,31,34,.84);border:1px solid rgba(222,188,113,.34);padding:20px;box-shadow:0 15px 35px rgba(0,0,0,.2);backdrop-filter:blur(6px)}.panel h3{font-weight:500;color:#e8cc8d;letter-spacing:.1em;margin-top:0}.wide{grid-column:1/-1}
.bar-row{display:grid;grid-template-columns:85px 1fr 46px;gap:8px;align-items:center;margin:13px 0}.track{height:8px;background:#13383a}.fill{height:100%;border-radius:10px}.radar{width:100%;max-width:310px;display:block;margin:auto}.copy{line-height:1.9;color:#e7ddc7}.flow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.flow span{padding:7px 10px;border:1px solid rgba(222,191,122,.35)}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.darkghost{border:1px solid #947d4c;color:#e8d5a7;background:rgba(0,0,0,.18);padding:12px 20px}.note{text-align:center;color:#8fa5a0;font-size:12px;margin-top:18px}

function score(){
 // Rank points: 5,3,1,0. Pairwise discriminator: 3.5 to the preferred pole.
 // This keeps second preference meaningful while giving targeted pairwise items enough power to separate close profiles.
 let sc={sword:0,dan:0,fu:0,array:0};
 Q.forEach((q,i)=>{if(q.t==="heart")return;if(q.t==="rank"){[5,3,1,0].forEach((w,k)=>sc[ans[i][k]]+=w)}else sc[ans[i]]+=3.5});
 let total=Object.values(sc).reduce((a,b)=>a+b,0),pct={};Object.keys(sc).forEach(k=>pct[k]=Math.round(sc[k]/total*100));
 // Correct rounding drift.
 let drift=100-Object.values(pct).reduce((a,b)=>a+b,0);let maxk=Object.keys(pct).sort((a,b)=>pct[b]-pct[a])[0];pct[maxk]+=drift;
 let order=Object.keys(pct).sort((a,b)=>pct[b]-pct[a]);sessionStorage.setItem("result",JSON.stringify({pct,order,heart}));
 show("reveal");setTimeout(()=>{show("result");drawResult(pct,order,heart)},1900)
}

function roundRectV12(ctx,x,y,w,h,r,fill,stroke){
